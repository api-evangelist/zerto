name: Zerto
description: >-
  Zerto, a Hewlett Packard Enterprise company, provides continuous data protection (CDP),
  disaster recovery, ransomware resilience, and multi-cloud data mobility for on-premises and
  cloud workloads. Its ZVM (Zerto Virtual Manager), ZCA (Zerto Cloud Appliance), and ZIC (Zerto
  In-Cloud) appliances expose a REST API under /v1, authenticated through an embedded Keycloak
  OAuth2 identity provider. The API lets teams manage Virtual Protection Groups (VPGs),
  orchestrate non-disruptive failover tests and live failover/failback, browse recovery
  checkpoints, run file- and VM-level restores, manage long-term retention repositories, and
  consume alerts and events — everything the Zerto UI does, driven programmatically. Zerto
  publishes an official PowerShell SDK, plus Python, Ansible, Terraform, and Postman examples via
  its ZertoPublic GitHub organization.
